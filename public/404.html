      html {

      body {

      }
    </style>
    <script>
      (function () {
        var base = '/Adrian_Espinola_Portfolio/';
        var path = location.pathname;
        var target = base;
        if (path.indexOf(base) === 0) {
          var rest = path.slice(base.length);
          if (rest) {
            target = base + '#' + rest;
          }
        }
        location.replace(target);
      })();
    </script>
