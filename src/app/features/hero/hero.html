<header id="intro" class="intro">
  <div class="intro-container">
    <div class="intro-content">
      <p class="hero-kicker">Portfolio</p>

      <h1 class="intro-name">
        Adrián<br />
        <span class="name-line-accent">Espínola</span><br />
        Gumiel
      </h1>

      <div class="hero-ornament"><span></span><i>◆</i><span></span></div>

      <p class="intro-role">{{ langService.t().hero.role }}</p>
      <p class="intro-subtitle">{{ langService.t().hero.building }} <span id="typing"></span></p>

      <div class="intro-actions">
        <a href="#projects" class="btn btn-primary">
          <i class="fa-solid fa-code"></i> {{ langService.t().hero.explore }}
        </a>
        <a
          href="CV_Adrian_Espinola_Gumiel.pdf"
          class="btn btn-ghost"
          target="_blank"
          rel="noopener"
        >
          <i class="fa-solid fa-arrow-down-to-bracket"></i> {{ langService.t().hero.cv }}
        </a>
      </div>

      <p class="hero-status">
        <span class="dot-live"></span>
        <span>{{ langService.t().hero.status }}</span>
      </p>
    </div>

    <div class="intro-avatar-wrapper">
      <figure class="avatar-frame" (click)="eggs.onAvatarClick()">
        <picture>
          <source srcset="Images/profile.webp" type="image/webp" />
          <img
            src="Images/profile.jpeg"
            alt="Adrián Espínola Gumiel"
            class="profile-photo"
            width="1530"
            height="2040"
            decoding="async"
          />
        </picture>
      </figure>
    </div>
  </div>

  <a href="#about" class="scroll-down" [attr.aria-label]="langService.t().hero.scrollLabel">
    <i class="fa-solid fa-chevron-down"></i>
  </a>
</header>
