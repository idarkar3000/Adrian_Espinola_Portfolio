<section id="skills" class="skills-section">
  <div class="section-badge">{{ langService.t().skills.badge }}</div>
  <h2 class="section-title">{{ langService.t().skills.title }}</h2>

  <div class="skills-grid">
    @for (card of langService.t().skills.cards; track card.title) {
      <div class="tech-card glass-card">
        <div class="tech-card-header">
          <i [class]="card.icon"></i>
          <h3>{{ card.title }}</h3>
        </div>
        <p>{{ card.desc }}</p>
        <div class="pill-group">
          @for (pill of card.pills; track pill) {
            <span>{{ pill }}</span>
          }
        </div>
      </div>
    }
  </div>
</section>
