<section id="about" class="about-section">
  <div class="section-badge">{{ langService.t().about.badge }}</div>
  <h2 class="section-title">{{ langService.t().about.title }}</h2>

  <div class="about-grid">
    <div class="about-text glass-card">
      <p [innerHTML]="langService.t().about.p1"></p>
      <p [innerHTML]="langService.t().about.p2"></p>
      <div class="status-indicator">
        <span class="pulse-ring"></span>
        <span>{{ langService.t().about.status }}</span>
      </div>
    </div>

    <div class="about-highlights glass-card">
      @for (stat of langService.t().about.stats; track stat.number) {
        <div class="stat-box">
          <span class="stat-number">{{ stat.number }}</span>
          <span class="stat-label">{{ stat.label }}</span>
        </div>
      }
    </div>
  </div>
</section>
