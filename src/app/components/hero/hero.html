<header id="intro" class="intro">
  <div id="particles-js"></div>
  <div class="intro-container">
    <div class="intro-content">
      <div class="badge-terminal">
        <span class="dot-live"></span>
        <code>{{ langService.t().hero.status }}</code>
      </div>
      <h1 class="intro-name">Adrián Espínola Gumiel</h1>
      <h2 class="intro-role">{{ langService.t().hero.role }}</h2>
      <h3 class="intro-subtitle">
        {{ langService.t().hero.building }} <span id="typing"></span>
      </h3>
      <div class="intro-actions">
        <a href="#projects" class="btn btn-glow"><i class="fa-solid fa-code"></i> {{ langService.t().hero.explore }}</a>
        <a href="CV_Adrian_Espinola_Gumiel.pdf" class="btn btn-glass" target="_blank" rel="noopener">
          <i class="fa-solid fa-arrow-down-to-bracket"></i> {{ langService.t().hero.cv }}
        </a>
      </div>
    </div>

    <div class="intro-avatar-wrapper">
      <div class="avatar-frame">
        <img src="Images/profile.jpeg" alt="Adrián Espínola Gumiel" class="profile-photo" />
        <div class="avatar-glow"></div>
      </div>
    </div>
  </div>

  <a href="#about" class="scroll-down" [attr.aria-label]="langService.t().hero.scrollLabel">
    <i class="fa-solid fa-chevron-down"></i>
  </a>
</header>
