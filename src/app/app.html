<app-navbar />

<app-hero />

<main class="container">
  <app-about />
  <app-skills />
  <app-experience />
  <app-projects />
  <app-education />
  <app-contact />
</main>

<app-footer />

<div class="toast-layer" aria-live="polite">
  @for (toast of eggs.toasts(); track toast.key) {
    <div class="toast">
      <i class="fa-solid fa-trophy"></i>
      <div class="toast-body">
        <small>{{ langService.t().eggs.unlocked }}</small>
        <strong>{{ eggs.text(toast.id).title }}</strong>
        <p>{{ eggs.text(toast.id).desc }}</p>
      </div>
    </div>
  }
</div>
